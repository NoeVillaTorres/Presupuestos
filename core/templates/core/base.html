<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}INELECTRICA{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
        }
        
        /* Selects e Inputs globales */
        select, input[type="number"], input[type="text"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            width: 100%;
            outline: none;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen w-full bg-gray-900 text-white relative">

    <div class="fixed inset-0 z-0">
        <img src="{% block background_image %}{% endblock %}"
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-gray-900/30"></div>
    </div>

    <main class="relative z-10 min-h-screen">
        <!-- BOTÓN DE LOGOUT ULTRA COMPACTO -->
        {% if user.is_authenticated %}
        <div class="absolute top-3 right-3 z-50">
            <form method="post" action="{% url 'logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit" 
                        title="Cerrar sesión"
                        class="px-2 py-0.5 bg-red-500/20 hover:bg-red-500/40 border border-red-500/30 text-red-300 rounded-md text-[8px] font-bold uppercase tracking-wider transition-all active:scale-95 shadow-sm backdrop-blur-sm">
                    Salir
                </button>
            </form>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

</body>
</html>
